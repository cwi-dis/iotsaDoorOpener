; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs = nodemcuv2
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
	iotsa-board-traits.ini
	iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
	https://github.com/cwi-dis/iotsa.git#develop
	MFRC522
build_flags = -DIOTSA_WITH_HTTPS

; The deployed doors (immersiondoor / m377door / pampusdoor / solderdoor).
; HTTP only: BearSSL on ESP8266 is too slow/unstable in practice, see
; cwi-dis/iotsa#159. 4m1m (1MB LittleFS -- rfid.cfg + users.json is a few KB)
; instead of 4m3m so there is room for the OTA scratch partition.
[env:nodemcuv2]
extends = iotsa_v4
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =

; Build-only canary: no ESP32 doorlock is deployed yet, but keep an ESP32
; target (with HTTPS) compiling against develop so future units can be based
; on one. vanilla_esp32 tracks iotsa's current default plain-ESP32 board.
[env:vanilla_esp32]
extends = vanilla_esp32
